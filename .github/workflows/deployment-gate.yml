name: PRE-BETA-003 Deployment Gate

on:
  pull_request:
    paths:
      - 'deployment/**'
      - '.dockerignore'
      - '.github/workflows/deployment-gate.yml'

permissions:
  contents: read

jobs:
  offline-package-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Tests hors réseau du packaging
        run: node --test deployment/preflight.test.mjs deployment/migration-plan.test.mjs deployment/packaging.test.mjs deployment/mongo-verify.test.mjs

      - name: Préparer un fichier d'environnement fictif sans secrets
        run: cp deployment/production.env.example .env.production

      - name: Validation syntaxique Docker Compose
        run: docker compose --env-file .env.production -f deployment/compose.yaml config --quiet

      - name: Images Node et Caddy compilables
        run: docker compose --env-file .env.production -f deployment/compose.yaml build
