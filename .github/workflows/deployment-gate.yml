name: PRE-BETA-003 Deployment Gate

on:
  pull_request:
    paths:
      - 'deployment/**'
      - 'frontend/**'
      - '.github/workflows/deployment-gate.yml'

permissions:
  contents: read

jobs:
  offline-package-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Tests hors réseau du packaging
        run: node --test deployment/preflight.test.mjs deployment/migration-plan.test.mjs deployment/mongo-verify.test.mjs deployment/native/packaging.test.mjs deployment/native/preflight.test.mjs deployment/native/host-check.test.mjs deployment/native/release-control.test.mjs

      - name: Syntaxe des scripts Linux
        run: |
          bash -n deployment/native/bootstrap-layout.sh
          bash -n deployment/native/stage-release.sh
          bash -n deployment/native/publish-release.sh

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend natif
        run: npm --prefix frontend run build
