name: Core Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-gate:
    name: Core Gate
    # MongoDB 8.0 cannot start on Linux 6.19-7.0.13 (SERVER-121912).
    # ubuntu-22.04 currently provides a compatible 6.8 kernel; revisit this pin.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/saas_fiches_techniques_gms_test?replicaSet=rs0
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_0123456789abcdef
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_ACCESS_ISSUER: saas-core-api
      JWT_ACCESS_AUDIENCE: saas-core-api
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 7
      PASSWORD_RESET_TOKEN_EXPIRES_IN_MINUTES: 15
      WORKSPACE_OWNERSHIP_TRANSFER_AUTHORIZATION_TTL_HOURS: 24
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_USER: ci-user
      SMTP_PASSWORD: ci-password
      SMTP_FROM_EMAIL: no-reply@example.test
      SMTP_FROM_NAME: SAAS Core CI
      UPLOAD_MAX_FILE_SIZE_BYTES: 5242880
      FILE_RETENTION_DAYS: 30
      FILE_STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT_DIR: uploads/files
      UPLOAD_TEMP_DIR: uploads/tmp
      CLAMAV_BINARY_PATH: clamscan
      CLAMAV_SCAN_TIMEOUT_MS: 30000
      UPLOAD_TEMP_FILE_MAX_AGE_MINUTES: 60
      TRIAL_IDENTITY_SECRET: ci_test_trial_identity_secret_0123456789abcdef
      ALLOW_DEVELOPMENT_DATA_RESET: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install E2E dependencies
        run: npm --prefix e2e ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav

      - name: Verify MongoDB host kernel compatibility
        run: |
          set -euo pipefail

          kernel_release="$(uname -r)"
          echo "Runner kernel: $kernel_release"
          if [[ ! "$kernel_release" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Could not parse runner kernel version: $kernel_release" >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( (major == 6 && minor >= 19) || (major == 7 && minor == 0 && patch < 14) )); then
            echo "::error::Kernel $kernel_release is incompatible with MongoDB 8.0 (SERVER-121912)." >&2
            exit 1
          fi

      - name: Verify MongoDB image
        run: |
          set -euo pipefail

          docker pull mongo:8.0
          docker image inspect mongo:8.0 \
            --format 'Image={{.Id}} OS={{.Os}} Architecture={{.Architecture}} Digests={{json .RepoDigests}}'
          # The running server is checked for its MongoDB version after readiness.
          # A disposable container would discard the diagnostic evidence on early exit.

      - name: Start MongoDB replica set
        run: |
          set -euo pipefail

          # Do not use --rm: retain an exited container and its logs for diagnosis.
          container_id="$(docker run -d \
            --name saas-core-mongo \
            -p 127.0.0.1:27017:27017 \
            mongo:8.0 \
            --replSet rs0 \
            --bind_ip_all)"
          test -n "$container_id"
          echo "MongoDB container: $container_id"

          ready=false
          for attempt in {1..30}; do
            state="$(docker inspect saas-core-mongo --format '{{.State.Status}}')"
            if [[ "$state" != "running" ]]; then
              exit_code="$(docker inspect saas-core-mongo --format '{{.State.ExitCode}}')"
              echo "::error::MongoDB exited before readiness (state=$state, exitCode=$exit_code)." >&2
              exit 1
            fi
            if docker exec saas-core-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -qx '1'; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != true ]]; then
            echo "::error::MongoDB did not respond to ping within 60 seconds." >&2
            exit 1
          fi

          mongo_version="$(docker exec saas-core-mongo mongosh --quiet --eval 'db.version()')"
          echo "Running MongoDB server version: $mongo_version"
          if [[ ! "$mongo_version" =~ ^8\.0\.[0-9]+$ ]]; then
            echo "::error::MongoDB server must use the 8.0 release series (got: $mongo_version)." >&2
            exit 1
          fi

          docker exec saas-core-mongo mongosh --quiet --eval \
            'const result = rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}); if (result.ok !== 1) { printjson(result); quit(1); }'

          primary=false
          for attempt in {1..30}; do
            state="$(docker inspect saas-core-mongo --format '{{.State.Status}}')"
            if [[ "$state" != "running" ]]; then
              exit_code="$(docker inspect saas-core-mongo --format '{{.State.ExitCode}}')"
              echo "::error::MongoDB exited during replica set election (state=$state, exitCode=$exit_code)." >&2
              exit 1
            fi
            if docker exec saas-core-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx 'true'; then
              primary=true
              break
            fi
            sleep 2
          done

          if [[ "$primary" != true ]]; then
            echo "::error::MongoDB replica set rs0 did not become writable primary within 60 seconds." >&2
            exit 1
          fi

          echo 'MongoDB replica set rs0 is writable primary.'

      - name: Run canonical Core gate
        run: npm run release:check

      - name: MongoDB diagnostics on failure
        if: failure()
        run: |
          docker ps -a --filter 'name=^/saas-core-mongo$'
          if docker container inspect saas-core-mongo >/dev/null 2>&1; then
            docker inspect saas-core-mongo --format \
              'MongoDB state={{.State.Status}} exitCode={{.State.ExitCode}} error={{.State.Error}} image={{.Image}}'
            docker logs --timestamps saas-core-mongo
          else
            echo 'MongoDB container was not created or is no longer available.'
          fi

      - name: Remove MongoDB container
        if: always()
        run: |
          if docker container inspect saas-core-mongo >/dev/null 2>&1; then
            docker rm -f saas-core-mongo
          fi
