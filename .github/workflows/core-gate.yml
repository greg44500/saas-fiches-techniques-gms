name: Core Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-gate:
    name: Core Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/saas_fiches_techniques_gms_test?replicaSet=rs0
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_0123456789abcdef
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_ACCESS_ISSUER: saas-core-api
      JWT_ACCESS_AUDIENCE: saas-core-api
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 7
      PASSWORD_RESET_TOKEN_EXPIRES_IN_MINUTES: 15
      WORKSPACE_OWNERSHIP_TRANSFER_AUTHORIZATION_TTL_HOURS: 24
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_USER: ci-user
      SMTP_PASSWORD: ci-password
      SMTP_FROM_EMAIL: no-reply@example.test
      SMTP_FROM_NAME: SAAS Core CI
      UPLOAD_MAX_FILE_SIZE_BYTES: 5242880
      FILE_RETENTION_DAYS: 30
      FILE_STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT_DIR: uploads/files
      UPLOAD_TEMP_DIR: uploads/tmp
      CLAMAV_BINARY_PATH: clamscan
      CLAMAV_SCAN_TIMEOUT_MS: 30000
      UPLOAD_TEMP_FILE_MAX_AGE_MINUTES: 60
      TRIAL_IDENTITY_SECRET: ci_test_trial_identity_secret_0123456789abcdef
      ALLOW_DEVELOPMENT_DATA_RESET: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install E2E dependencies
        run: npm --prefix e2e ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav

      - name: Start MongoDB replica set
        run: |
          docker run --rm -d \
            --name saas-core-mongo \
            -p 27017:27017 \
            mongo:8.0 \
            --replSet rs0 \
            --bind_ip_all

          for attempt in {1..30}; do
            if docker exec saas-core-mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q '^1$'; then
              break
            fi
            sleep 2
          done

          docker exec saas-core-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

          for attempt in {1..30}; do
            if docker exec saas-core-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q '^true$'; then
              exit 0
            fi
            sleep 2
          done

          echo 'MongoDB replica set did not become writable primary.' >&2
          docker logs saas-core-mongo
          exit 1

      - name: Run canonical Core gate
        run: npm run release:check

      - name: MongoDB logs on failure
        if: failure()
        run: docker logs saas-core-mongo || true
