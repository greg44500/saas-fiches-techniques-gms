name: fichepilot-beta

services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ../.env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    restart: unless-stopped
    init: true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
      CLIENT_URL: https://app.fichepilot.fr
      FILE_STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT_DIR: /var/lib/fichepilot/files
      UPLOAD_TEMP_DIR: /var/lib/fichepilot/tmp
      CLAMAV_BINARY_PATH: clamscan
      E2E_BYPASS_RATE_LIMITS: "false"
      ALLOW_DEVELOPMENT_DATA_RESET: "false"
    # AUCUN port API publié sur l'hôte.
    volumes:
      - /var/lib/fichepilot/files:/var/lib/fichepilot/files
      - /var/lib/fichepilot/tmp:/var/lib/fichepilot/tmp
      - clamav_signatures:/var/lib/clamav:ro
    depends_on:
      clamav_update:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  clamav_update:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    command: ["/bin/sh", "-ec", "while :; do freshclam || echo 'FreshClam: échec de mise à jour'; sleep 21600; done"]
    user: "0:0"
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "(test -s /var/lib/clamav/main.cvd || test -s /var/lib/clamav/main.cld) && (test -s /var/lib/clamav/daily.cvd || test -s /var/lib/clamav/daily.cld)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

volumes:
  caddy_data:
  caddy_config:
  clamav_signatures:
